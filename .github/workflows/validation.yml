name: KOFFI SHOP validation

on:
  pull_request:
    branches: [main, integration/pr5-pr6]
  push:
    branches: [fix/account-identity-deduplication, integration/pr5-pr6]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Install test dependencies
        run: python -m pip install "pydantic==2.13.4" "email-validator==2.3.0" "pillow==12.3.0" "requests==2.34.2"
      - name: Run security contract tests
        run: python -m unittest discover -s tests -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Build production frontend
        run: npm run build
